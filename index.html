<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max und Mini auf dem Zahlenstrahl</title>
<style>
:root{--ink:#1d3557;--sun:#ffc933;--dog:#e8903a;--frog:#43a047;--grass:#d9f0c7;--ok:#2e7d32;--okbg:#d6f0d0;--bad:#c62828;--badbg:#fbe0dc;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#cfeaff,#eaf6ff 35%,#f1fae4);min-height:100vh;color:var(--ink);font-family:"Avenir Next","Trebuchet MS",ui-rounded,system-ui,sans-serif;font-size:21px;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;touch-action:manipulation}
main{max-width:1200px;margin:0 auto;padding:18px 24px 48px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.badges{display:flex;flex:none}
.bd{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:44px;border:4px solid #fff;box-shadow:0 2px 0 rgba(29,53,87,.25)}
.bd svg{width:84%;height:84%}
.bd.d{background:var(--dog)}.bd.f{background:var(--frog);margin-left:-14px}
h1{font-size:38px;line-height:1.1;margin:0}
header p{margin:2px 0 0}
.btn{min-height:56px;padding:8px 24px;border-radius:18px;border:3px solid var(--ink);background:#fff;font-weight:700}
.btn.pri{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,.mode:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lead{font-weight:700;margin:6px 0}
.lv{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lv button{padding:8px 18px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:700;text-align:left}
.lv button small{display:block;font-weight:400;font-size:17px}
.lv button[aria-pressed=true]{background:var(--sun)}
.modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin:12px 0}
.mode{text-align:left;padding:16px 20px;border-radius:22px;border:3px solid var(--ink);background:#fff;display:flex;gap:14px;align-items:center}
.mode i{font-style:normal;font-size:44px;flex:none}
.mode b{display:block;font-size:26px}
.mode span{font-size:19px}
.mode.d{background:#ffe9d0}.mode.f{background:#dbf3d8}.mode.x{background:#e8e1ff}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.leaves{display:flex;gap:8px;flex-wrap:wrap}
.leaf{width:24px;height:24px;border-radius:0 100% 0 100%;border:3px solid var(--frog);background:#fff}
.leaf.now{background:var(--sun);border-color:var(--ink)}
.leaf.done{background:#b9c6d6;border-color:var(--ink)}
.leaf.star{background:var(--frog)}
.task{font-size:25px;margin:6px 0 10px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:10px 14px 4px;margin-bottom:14px}
.card svg{width:100%;height:auto;display:block}
.tk{transition:stroke .2s}
.hit{cursor:pointer}
.ch{min-width:150px;font-size:26px}
.ch.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ch.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#in{font:inherit;font-size:30px;width:240px;height:64px;padding:0 16px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);text-align:center}
#in.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.say{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pf{flex:none;width:74px}
.pf svg{width:74px;display:block}
.fb{flex:1;position:relative;min-height:66px;padding:12px 18px;border-radius:22px;border:3px solid var(--ink);background:#fff;font-size:22px}
.fb::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;width:18px;height:18px;background:inherit;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.fb.good{background:var(--okbg);border-color:var(--ok)}
.fb.nope{background:var(--badbg);border-color:var(--bad)}
.fb.good::before{border-color:var(--ok)}.fb.nope::before{border-color:var(--bad)}
@keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.shake{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
#end{text-align:center;padding-top:6px}
.big{font-size:70px;line-height:1;color:var(--sun);margin:10px 0;-webkit-text-stroke:2px var(--ink)}
@media (max-width:700px){h1{font-size:27px}.bd{width:56px;height:56px;font-size:32px}}
</style>
</head>
<body>
<main>
<header>
  <div class="badges"><span class="bd d"></span><span class="bd f"></span></div>
  <div><h1>Max und Mini auf dem Zahlenstrahl</h1><p>Zahlenraum von 100.000 bis 1.000.000</p></div>
</header>

<section id="menu">
  <p class="lead">Schrittgrößen:</p>
  <div class="lv" id="lv">
    <button data-l="1" aria-pressed="false">Leicht<small>10.000er und 100.000er</small></button>
    <button data-l="2" aria-pressed="true">Mittel<small>dazu 1.000er</small></button>
    <button data-l="3" aria-pressed="false">Schwer<small>dazu 100er</small></button>
  </div>
  <p class="lead">Wähle ein Spiel:</p>
  <div class="modes">
    <button class="mode d" data-m="1"><i>📏</i><div><b>Wie groß ist ein Schritt?</b><span>Bestimme den Abstand zwischen zwei Strichen.</span></div></button>
    <button class="mode f" data-m="2"><i>📍</i><div><b>Zahl eintragen</b><span>Tippe auf den Strich, an dem die Zahl liegt.</span></div></button>
    <button class="mode d" data-m="3"><i>🔍</i><div><b>Wo sitzt das Tier?</b><span>Lies die Zahl ab, auf der Max oder Mini sitzt.</span></div></button>
    <button class="mode f" data-m="4"><i>🦘</i><div><b>Hüpf-Aufgaben</b><span>Das Tier hüpft Schritte nach rechts oder links.</span></div></button>
    <button class="mode x" data-m="0"><i>🎲</i><div><b>Alles gemischt</b><span>Alle vier Spiele durcheinander.</span></div></button>
  </div>
</section>

<section id="play" hidden>
  <div class="tools"><button class="btn" id="back">‹ Spiele</button><div class="leaves" id="dots" aria-hidden="true"></div></div>
  <p class="task" id="q"></p>
  <div class="card" id="nl"></div>
  <div class="row" id="ch" hidden></div>
  <div class="row" id="ans" hidden>
    <input id="in" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Zahl" aria-label="Zahl">
    <button class="btn pri" id="chk">Prüfen</button>
  </div>
  <div class="say"><div class="pf" id="pf" aria-hidden="true"></div><div class="fb" id="fb" role="status" aria-live="polite"></div></div>
  <div class="row"><button class="btn" id="sol" hidden>Lösung zeigen</button><button class="btn pri" id="nxt" hidden>Weiter ›</button></div>
</section>

<section id="end" hidden>
  <div class="badges" style="justify-content:center"><span class="bd d"></span><span class="bd f"></span></div>
  <h1>Max und Mini sind stolz auf euch!</h1>
  <div class="big" id="stars"></div>
  <p id="score"></p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="again">Noch eine Runde</button><button class="btn" id="home">Anderes Spiel</button></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
/* Skalierung: iPad bleibt bei 100 %, große Bildschirme (digitale Tafel) werden vergrößert */
function fit(){const w=innerWidth,h=innerHeight,z=Math.max(1,Math.min(w/1200,h/850));document.documentElement.style.zoom=z}
fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);

const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[Math.floor(Math.random()*a.length)];
const STEPS={1:[100000,10000],2:[100000,10000,1000],3:[100000,10000,1000,100]};
const X=i=>60+88*i;
let lvl=2,st={};

/* ---------- Aufgaben erzeugen (unendlich viele, zufällig) ---------- */
function base(){
  const step=one(STEPS[lvl]),span=step*10;let b=0;
  if(step<100000)b=span*rnd(Math.ceil(100000/span),Math.floor(1000000/span)-1);
  return {step:step,base:b};
}
const val=(t,i)=>t.base+i*t.step;
const PAIRS=[[0,10],[0,5],[5,10],[0,2],[2,4],[3,6],[4,8]];
function task(m){
  const t=base();t.m=m;t.pet=one([{e:"🐶",n:"Max"},{e:"🐸",n:"Mini"}]);t.labels=new Set([0,10]);t.pos=null;
  if(m===1){const p=one(PAIRS);t.labels=new Set(p);t.n=p[1]-p[0];t.kind="choice";t.ans=t.step;
    t.q="Wie groß ist ein Schritt? Das ist der Abstand von einem Strich zum nächsten.";t.pair=p}
  if(m===2){t.k=rnd(1,9);t.v=val(t,t.k);t.pos=0;t.kind="tap";t.ans=t.v;
    t.q=`Tippe auf die Stelle für <b>${fmt(t.v)}</b>. Dort soll ${t.pet.n} hinhüpfen.`}
  if(m===3){t.k=rnd(1,9);t.pos=t.k;t.kind="type";t.ans=val(t,t.k);
    t.q=`Welche Zahl gehört zu der Stelle, an der ${t.pet.n} sitzt?`}
  if(m===4){let a,n,d,b2;do{a=rnd(2,8);n=rnd(1,lvl===1?3:4);d=one([1,-1]);b2=a+d*n}while(b2<1||b2>9);
    t.labels=new Set([0,10,a]);t.pos=a;t.kind="type";t.hop=b2;t.ans=val(t,b2);
    t.q=`${t.pet.n} sitzt auf <b>${fmt(val(t,a))}</b> und hüpft <b>${n} Schritt${n>1?"e":""}</b> nach <b>${d>0?"rechts":"links"}</b>. Auf welcher Zahl landet ${t.pet.n}?`;t.nn=n}
  return t;
}

/* ---------- Zahlenstrahl zeichnen ---------- */
/* Alle Positionen kommen aus X(i); Figur und Striche nutzen dieselbe Funktion. Nur SVG-Attribute, keine CSS-Transforms. */
function shape(k){
  if(k==="dog")return '<ellipse cx="-25" cy="-4" rx="11" ry="20" fill="#8a5a2b" transform="rotate(14 -25 -4)"/><ellipse cx="25" cy="-4" rx="11" ry="20" fill="#8a5a2b" transform="rotate(-14 25 -4)"/><circle r="28" fill="#e8a45a"/><ellipse cy="10" rx="15" ry="11" fill="#fbe3c2"/><circle cx="-11" cy="-6" r="4.5" fill="#1d3557"/><circle cx="11" cy="-6" r="4.5" fill="#1d3557"/><circle cx="-9.6" cy="-7.4" r="1.5" fill="#fff"/><circle cx="12.4" cy="-7.4" r="1.5" fill="#fff"/><ellipse cy="5" rx="5.5" ry="3.8" fill="#1d3557"/><path d="M-8 14 Q0 22 8 14" fill="none" stroke="#1d3557" stroke-width="2.6" stroke-linecap="round"/><path d="M-3 18 Q0 27 3 18 Z" fill="#f06292"/>';
  return '<circle cx="-17" cy="-22" r="12" fill="#43a047"/><circle cx="17" cy="-22" r="12" fill="#43a047"/><ellipse rx="31" ry="25" fill="#4caf50"/><circle cx="-17" cy="-23" r="8" fill="#fff"/><circle cx="17" cy="-23" r="8" fill="#fff"/><circle cx="-16" cy="-22" r="4" fill="#1d3557"/><circle cx="18" cy="-22" r="4" fill="#1d3557"/><circle cx="-20" cy="8" r="5" fill="#f48fb1" opacity=".7"/><circle cx="20" cy="8" r="5" fill="#f48fb1" opacity=".7"/><path d="M-17 6 Q0 22 17 6" fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/>';
}
const icon=k=>`<svg viewBox="-40 -42 80 80" aria-hidden="true">${shape(k)}</svg>`;
function svg(t){
  const Y=120;
  let s=`<svg viewBox="0 0 1000 220" role="img" aria-label="Zahlenstrahl"><rect x="0" y="140" width="1000" height="80" rx="18" fill="#d9f0c7"/>`;
  s+=`<line x1="24" y1="${Y}" x2="972" y2="${Y}" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/><path d="M958 ${Y-13} L982 ${Y} L958 ${Y+13}" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  for(let i=0;i<=10;i++){
    const h=i===0||i===10?38:i===5?30:20;
    s+=`<line id="tk${i}" class="tk" x1="${X(i)}" x2="${X(i)}" y1="${Y-h}" y2="${Y+h}" stroke="#1d3557" stroke-width="${h>20?6:4}" stroke-linecap="round"/>`;
    if(t.labels.has(i))s+=`<text x="${X(i)}" y="198" text-anchor="middle" font-size="27" font-weight="700" fill="#1d3557">${fmt(val(t,i))}</text>`;
  }
  if(t.pos!==null)s+=`<g id="pet" transform="translate(${X(t.pos)} 0)"><line x1="0" x2="0" y1="80" y2="172" stroke="#ff7043" stroke-width="3.5" stroke-dasharray="7 6"/><g transform="translate(0 46)">${shape(t.pet.n==="Max"?"dog":"frog")}</g><circle cx="0" cy="${Y}" r="9" fill="#ff7043" stroke="#fff" stroke-width="3"/></g>`;
  if(t.kind==="tap")for(let i=0;i<=10;i++)s+=`<rect class="hit" data-i="${i}" x="${X(i)-38}" y="30" width="76" height="140" fill="transparent"/>`;
  return s+"</svg>";
}
const mark=(i,c)=>{const e=$("tk"+i);if(e)e.setAttribute("stroke",c)};
let px=0,hopId=0;
const place=(x,y)=>{const p=$("pet");if(p)p.setAttribute("transform","translate("+x+" "+y+")")};
function hop(i){
  const a=px,b=X(i),id=++hopId,t0=performance.now();px=b;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){place(b,0);return}
  (function f(now){if(id!==hopId)return;const k=Math.min(1,(now-t0)/650);
    if(k<1){place(a+(b-a)*k,-Math.sin(Math.PI*k)*30);requestAnimationFrame(f)}else place(b,0)})(t0);
}
document.querySelectorAll(".bd.d").forEach(e=>e.innerHTML=icon("dog"));
document.querySelectorAll(".bd.f").forEach(e=>e.innerHTML=icon("frog"));

/* ---------- Ablauf ---------- */
function leaves(){$("dots").innerHTML=Array.from({length:st.n},(_,k)=>`<span class="leaf ${k<st.res.length?(st.res[k]?'star':'done'):k===st.i?'now':''}"></span>`).join("")}
function msg(t,k){$("fb").textContent=t;$("fb").className="fb "+(k||"")}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function show(id){["menu","play","end"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function start(m){st={m:m,i:0,n:10,stars:0,res:[]};show("play");load()}
function load(){
  const m=st.m||one([1,2,3,4]),t=task(m);st.t=t;st.tries=0;st.done=false;
  $("q").innerHTML=`Aufgabe ${st.i+1} von ${st.n}: ${t.q}`;
  hopId++;$("nl").innerHTML=svg(t);px=t.pos===null?0:X(t.pos);$("pf").innerHTML=icon(t.pet.n==="Max"?"dog":"frog");
  $("ch").hidden=t.kind!=="choice";$("ans").hidden=t.kind!=="type";
  if(t.kind==="choice")$("ch").innerHTML=[100,1000,10000,100000].map(v=>`<button class="btn ch" data-v="${v}">${fmt(v)}</button>`).join("");
  if(t.kind==="type"){const i=$("in");i.value="";i.readOnly=false;i.className="";$("chk").disabled=false}
  msg(t.kind==="tap"?"Zähle in gleich großen Schritten von der Zahl am Strich aus.":"Schau dir den Zahlenstrahl genau an.");
  $("sol").hidden=true;$("nxt").hidden=true;$("nxt").textContent=st.i===st.n-1?"Fertig ›":"Weiter ›";
  leaves();
}
function done(star,text){
  st.done=true;st.res.push(star);if(star)st.stars++;
  msg(text,"good");$("sol").hidden=true;$("nxt").hidden=false;$("chk").disabled=true;leaves();
}
function wrong(text){
  st.tries++;msg(text,"nope");shake($("nl"));if(st.tries>=2)$("sol").hidden=false;
}

/* Spiel 1: Schrittweite wählen */
$("ch").onclick=e=>{
  const b=e.target.closest(".ch");if(!b||st.done||b.disabled)return;const t=st.t;
  if(+b.dataset.v===t.ans){
    b.classList.add("ok");document.querySelectorAll(".ch").forEach(x=>x.disabled=true);
    const [i,j]=t.pair;done(st.tries===0,`Richtig! Von ${fmt(val(t,i))} bis ${fmt(val(t,j))} sind es ${t.n} Schritte: ${fmt(t.n*t.step)} : ${t.n} = ${fmt(t.step)}.`);
  }else{b.classList.add("no");b.disabled=true;
    wrong(st.tries===0?"Noch nicht. Wie viele Schritte liegen zwischen den beiden Zahlen? Teile den Unterschied durch diese Anzahl.":"Zähle die Striche zwischen den beiden Zahlen. Rechne dann: Unterschied : Anzahl der Schritte.");}
};

/* Spiel 2: Strich antippen */
$("nl").onclick=e=>{
  const h=e.target.closest(".hit"),t=st.t;if(!h||st.done||t.kind!=="tap")return;const i=+h.dataset.i;
  if(i===t.k){mark(i,"#2e7d32");hop(i);done(st.tries===0,`Richtig! ${fmt(t.v)} liegt genau dort. ${t.pet.n} hüpft hin.`)}
  else{mark(i,"#c62828");setTimeout(()=>mark(i,"#1d3557"),700);
    wrong(`Dort liegt ${fmt(val(t,i))}. Gesucht ist ${fmt(t.v)}.`+(st.tries>=1?` Ein Schritt ist hier ${fmt(t.step)} groß.`:""));}
};

/* Spiele 3 und 4: Zahl eintippen */
function check(){
  const t=st.t;if(st.done||t.kind!=="type")return;
  const d=$("in").value.replace(/\D/g,"");
  if(!d){msg("Schreibe zuerst eine Zahl.");return}
  if(+d===t.ans){
    $("in").readOnly=true;$("in").className="ok";$("in").value=fmt(t.ans);if(t.hop)hop(t.hop);
    done(st.tries===0,t.m===4?`Super! ${t.pet.n} landet auf ${fmt(t.ans)}.`:`Genau! ${t.pet.n} sitzt auf ${fmt(t.ans)}.`);
  }else wrong(t.m===4?`Noch nicht. Wie groß ist ein Schritt? So viele Schritte hüpft ${t.pet.n}: ${t.nn}.`:"Noch nicht. Wie groß ist ein Schritt? Zähle von einer Zahl am Zahlenstrahl aus Strich für Strich weiter.");
}
$("chk").onclick=check;
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});

$("sol").onclick=()=>{
  const t=st.t;
  if(t.kind==="choice"){document.querySelectorAll(".ch").forEach(x=>{x.disabled=true;if(+x.dataset.v===t.ans)x.classList.add("ok")});done(false,`Lösung: Ein Schritt ist ${fmt(t.step)} groß.`)}
  else if(t.kind==="tap"){mark(t.k,"#2e7d32");hop(t.k);done(false,`Lösung: ${fmt(t.v)} liegt an diesem Strich.`)}
  else{$("in").readOnly=true;$("in").className="ok";$("in").value=fmt(t.ans);if(t.hop)hop(t.hop);done(false,`Lösung: ${fmt(t.ans)}.`)}
};
$("nxt").onclick=()=>{
  if(st.i<st.n-1){st.i++;load();return}
  const k=Math.round(st.stars/st.n*5);
  $("stars").textContent="★".repeat(k)+"☆".repeat(5-k);
  $("score").textContent=`${st.stars} von ${st.n} Aufgaben hast du gleich beim ersten Versuch richtig gelöst.`;
  show("end");
};

/* Menü */
document.querySelectorAll("#lv button").forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;document.querySelectorAll("#lv button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(+b.dataset.m));
$("back").onclick=$("home").onclick=()=>show("menu");
$("again").onclick=()=>start(st.m);
</script>
</body>
</html>
